<div class="account-filter">
  <label class="sr-only" for="account-select">Account or portfolio</label>
  {# Each option is "param:id"; picking one swaps the account/portfolio query parameter and reloads. #}
  <select id="account-select"
          onchange="const u = new URL(location.href), [k, v] = this.value.split(':');
                    ['account', 'portfolio', 'page'].forEach((p) => u.searchParams.delete(p));
                    if (v) u.searchParams.set(k, v);
                    location.href = u.href;">
    <option value="">All accounts</option>
    {% if portfolios %}
    <optgroup label="Portfolios">
      {% for p in portfolios %}
        <option value="portfolio:{{ p.id }}" {% if p.id == portfolio_id and not account_id %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </optgroup>
    {% endif %}
    <optgroup label="Accounts">
      {% for a in accounts %}
        <option value="account:{{ a.id }}" {% if a.id == account_id %}selected{% endif %}>{{ a.name or a.type or 'Account' }} · {{ a.number }}</option>
      {% endfor %}
    </optgroup>
  </select>
</div>
