{# Performance chart and period returns; app.js fills it from the history API. #}
  <section class="card">
    <div class="card-head">
      <h2>Performance</h2>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Chart" id="chart-mode">
          <button type="button" data-mode="growth" aria-pressed="true">Growth</button>
          <button type="button" data-mode="returns" aria-pressed="false">Returns vs {{ benchmark }}</button>
          <button type="button" data-mode="benchmarks" aria-pressed="false">Benchmarks</button>
        </div>
        <div class="seg" role="group" aria-label="Time range" id="chart-range">
          {% for r in ('1M', '3M', '6M', 'YTD', '1Y', '5Y', 'All') %}
            <button type="button" data-range="{{ r }}" aria-pressed="{{ 'true' if r == 'All' else 'false' }}">{{ r }}</button>
          {% endfor %}
        </div>
      </div>
    </div>
    <div class="chart-box">
      <canvas id="perf-chart" aria-label="Portfolio performance chart" role="img"></canvas>
      <div class="chart-status" id="perf-status">Building history…</div>
    </div>
    <p class="hint" id="perf-note"></p>
    <div class="table-wrap"><table class="table compact" id="period-table"></table></div>
  </section>
